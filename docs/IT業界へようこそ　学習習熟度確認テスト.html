    <title>IT業界基礎知識 理解度テスト（1～4章・スプレッドシート記録機能付き）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; margin: 0; }
        .app-layout { display: flex; max-width: 1100px; margin: 2rem auto; gap: 1.5rem; padding: 0 1rem; }
        .sidebar { width: 220px; flex-shrink: 0; position: sticky; top: 2rem; align-self: flex-start; }
        .sidebar-inner { background: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 1rem; }
        .sidebar-title { font-weight: 700; font-size: 0.875rem; color: #6b7280; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .q-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
        .q-btn { width: 100%; aspect-ratio: 1; border-radius: 0.375rem; border: 2px solid #e5e7eb; background: white; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
        .q-btn:hover { border-color: #9ca3af; }
        .q-btn.current { border-color: #3b82f6; background-color: #eff6ff; color: #3b82f6; }
        .q-btn.answered { background-color: #3b82f6; border-color: #3b82f6; color: white; }
        .q-btn.skipped { background-color: #fbbf24; border-color: #fbbf24; color: #78350f; }
        .sidebar-legend { margin-top: 1rem; font-size: 0.75rem; color: #6b7280; }
        .sidebar-legend span { display: inline-flex; align-items: center; margin-right: 0.75rem; }
        .legend-dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; display: inline-block; }
        .main-content { flex: 1; min-width: 0; }
        .quiz-container { background-color: white; border-radius: 0.75rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); padding: 2rem; }
        .question-header { border-bottom: 2px solid #e5e7eb; padding-bottom: 1rem; margin-bottom: 1.5rem; }
        .question-title { font-size: 1.5rem; font-weight: 600; color: #111827; }
        .question-text { font-size: 1.125rem; margin-top: 0.5rem; color: #374151; }
        .options-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .option-button { display: block; width: 100%; padding: 1rem; border: 2px solid #d1d5db; border-radius: 0.5rem; text-align: left; font-size: 1rem; background-color: white; color: #1f2937; transition: all 0.15s; cursor: pointer; }
        .option-button:hover { background-color: #f9fafb; border-color: #9ca3af; }
        .option-button.selected { background-color: #eff6ff; border-color: #3b82f6; color: #1d4ed8; }
        .navigation-buttons { margin-top: 2rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        .nav-button { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; transition: background-color 0.15s; cursor: pointer; border: none; font-size: 0.95rem; }
        .nav-button.primary { background-color: #3b82f6; color: white; }
        .nav-button.primary:hover { background-color: #2563eb; }
        .nav-button.secondary { background-color: #e5e7eb; color: #374151; }
        .nav-button.secondary:hover { background-color: #d1d5db; }
        .nav-button.skip { background-color: #fef3c7; color: #92400e; }
        .nav-button.skip:hover { background-color: #fde68a; }
        .nav-button.submit { background-color: #10b981; color: white; }
        .nav-button.submit:hover { background-color: #059669; }
        .nav-button:disabled { background-color: #9ca3af; cursor: not-allowed; color: white; }
        .results-container { text-align: center; }
        .results-title { font-size: 1.875rem; font-weight: 700; color: #111827; margin-bottom: 1rem; }
        .results-score { font-size: 1.5rem; color: #374151; margin-bottom: 1rem; }
        .username-input { margin-bottom: 1rem; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 0.375rem; width: 100%; max-width: 300px; }
        #submission-status { margin-top: 1rem; font-size: 0.875rem; min-height: 1.25rem; }
        .gemini-button { background-color: #fbbf24; color: #78350f; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; transition: background-color 0.15s; cursor: pointer; border: none; font-size: 1rem; }
        .gemini-button:hover { background-color: #f59e0b; }
        .confirm-overlay { position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        .confirm-box { background: white; border-radius: 0.75rem; padding: 2rem; max-width: 500px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .unanswered-warning { color: #dc2626; font-weight: 600; margin: 0.75rem 0; }
        @media (max-width: 768px) {
            .app-layout { flex-direction: column; }
            .sidebar { width: 100%; position: static; }
            .q-grid { grid-template-columns: repeat(10, 1fr); }
        }
    </style>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz7EWD9o9eYNs7SZsXl17tJDKxXgGOqcLrMXSZ2r--ow6bsXUXylOfbh-jp-g2GzvqL3w/exec';

        const quizData = [
            { chapter: "第1章 業界の全体像とネットビジネス企業", question: "世界的に影響力の強いアメリカのIT企業群を表す「GAFAM」に、講義では**含まれていない**企業はどれですか？", options: ["Google", "Apple", "Twitter (現 X)", "Microsoft"], answer: 2, keywords: ["GAFAM", "IT企業"], explanation: "【GAFAM（ガーファム）】\nGoogle、Apple、Facebook（現Meta）、Amazon、Microsoftの5社の頭文字を取った呼び方です。世界のIT業界を牽引する巨大企業群で、検索・スマートフォン・SNS・EC・OSなど、私たちの日常生活に深く関わるサービスを提供しています。Twitter（現X）はGAFAMには含まれません。" },
            { chapter: "第1章 業界の全体像とネットビジネス企業", question: "クラウドサービスの主要な3つのサービスモデルとして、講義では**適切でない**ものはどれですか？", options: ["SaaS (Software as a Service)", "PaaS (Platform as a Service)", "DaaS (Desktop as a Service)", "IaaS (Infrastructure as a Service)"], answer: 2, keywords: ["クラウドサービス", "SaaS", "PaaS", "IaaS"], explanation: "【クラウドサービスの3つのモデル】\n・SaaS（サース）：ソフトウェアをインターネット経由で利用するサービス。例：Gmail、Microsoft 365\n・PaaS（パース）：アプリ開発に必要な環境（OS・データベースなど）を提供するサービス。例：Google App Engine\n・IaaS（イアース）：サーバーやネットワークなどのインフラをそのまま提供するサービス。例：AWS EC2\n\nDaaS（Desktop as a Service）は主要3モデルには含まれません。" },
            { chapter: "第1章 業界の全体像とネットビジネス企業", question: "システムインテグレーター（SIer）の主な分類として、講義では**含まれていない**ものはどれですか？", options: ["メーカー系", "ユーザー系", "コンサル系", "独立系"], answer: 2, keywords: ["システムインテグレーター", "SIer"], explanation: "【システムインテグレーター（SIer：エスアイアー）】\n企業のITシステムを企画・設計・開発・運用まで一括して請け負う会社のことです。主に3つに分類されます。\n・メーカー系：ハードウェアメーカーから派生（例：富士通、NEC系列）\n・ユーザー系：大企業の情報システム部門が独立（例：NTTデータ）\n・独立系：特定の親会社を持たず独自に設立（例：大塚商会）\n\nコンサル系という分類は一般的ではありません。" },
            { chapter: "第1章 業界の全体像とネットビジネス企業", question: "特定の企業が、個人に対して自社製品に関する知識や技術が一定水準にあることを認定するための資格の種類を何と呼びますか？", options: ["国家資格", "公的資格", "ベンダー資格", "学術資格"], answer: 2, keywords: ["ベンダー資格", "国家資格"], explanation: "【ベンダー資格】\nIT製品やサービスを提供する企業（ベンダー）が独自に認定する資格のことです。その企業の製品に関する専門知識を証明できます。\n例：AWS認定資格、Oracle認定Java資格、Microsoft Azure認定資格、Cisco CCNA など\n\n一方、国家資格はIPAが実施する「基本情報技術者試験」「応用情報技術者試験」などがあり、特定企業に依存しない汎用的なIT知識を証明します。" },
            { chapter: "第1章 業界の全体像とネットビジネス企業", question: "IT業界における「ベンダー」という用語の説明として、講義では最も適切なものはどれですか？", options: ["IT製品やサービスを購入する企業のこと", "IT製品やサービスを開発・販売する企業のこと", "ITシステムの運用保守を専門に行う技術者のこと", "IT業界の動向を調査・分析するコンサルタントのこと"], answer: 1, keywords: ["ベンダー", "IT業界"], explanation: "【ベンダー（Vendor）】\n英語で「売り手・販売者」を意味し、IT業界ではハードウェアやソフトウェア、サービスなどを開発・販売する企業のことを指します。\n例：Microsoft、Oracle、AWS、Salesforceなど\n\n反対に、ベンダーの製品を購入・利用する企業は「ユーザー企業」と呼ばれます。" },
            { chapter: "第2章 ビジネスシーンで使われるIT用語、ITエンジニアの種類と職種", question: "プロジェクトの各作業工程を細かく分割して構造化し、管理するために作成される図表を何と呼びますか？", options: ["RFP (Request For Proposal)", "WBS (Work Breakdown Structure)", "KPI (Key Performance Indicator)", "SCM (Supply Chain Management)"], answer: 1, keywords: ["WBS", "プロジェクト管理", "RFP", "KPI", "SCM"], explanation: "【WBS（Work Breakdown Structure）】\nプロジェクトの作業を細かく分解し、ツリー状に構造化した図表です。大きな目標を小さなタスクに分割することで、作業の漏れを防ぎ、スケジュールや担当者の管理がしやすくなります。\n\n関連用語：\n・RFP（提案依頼書）：発注先に「こんなシステムを作ってほしい」と要件を伝える文書\n・KPI（重要業績評価指標）：目標の達成度を測る指標\n・SCM（サプライチェーン管理）：原材料の調達から販売までの流れを最適化する手法" },
            { chapter: "第2章 ビジネスシーンで使われるIT用語、ITエンジニアの種類と職種", question: "ソフトウェア開発手法の一つで、最初に全ての仕様を決定し、滝の水が流れ落ちるように各工程を順番に進めていく手法を何と呼びますか？", options: ["アジャイル開発", "ウォーターフォール開発", "プロトタイプ開発", "スパイラル開発"], answer: 1, keywords: ["ウォーターフォール開発", "アジャイル開発", "ソフトウェア開発手法"], explanation: "【ウォーターフォール開発】\n「要件定義→設計→開発→テスト→リリース」と、滝の水が上から下に流れるように各工程を順番に進める開発手法です。最初に仕様をしっかり決めるため、大規模なシステム開発に向いています。\n\n【アジャイル開発】\n対照的に、小さな機能単位で「設計→開発→テスト」を短期間（1〜4週間）で繰り返す手法です。仕様変更に柔軟に対応できるため、Webサービスやアプリ開発で多く使われます。" },
            { chapter: "第2章 ビジネスシーンで使われるIT用語、ITエンジニアの種類と職種", question: "ウェブサイトやアプリケーションにおいて、ユーザーが直接目にし、操作する部分（ユーザーインターフェース）の開発を担当するエンジニアを何と呼びますか？", options: ["バックエンドエンジニア", "フロントエンドエンジニア", "インフラエンジニア", "データベースエンジニア"], answer: 1, keywords: ["フロントエンドエンジニア", "バックエンドエンジニア", "ユーザーインターフェース"], explanation: "【フロントエンドエンジニア】\nWebサイトやアプリで、ユーザーが直接見たり操作したりする部分（画面のデザイン、ボタン、入力フォームなど）を開発するエンジニアです。HTML、CSS、JavaScriptなどの技術を使います。\n\n【バックエンドエンジニア】\nユーザーからは見えない裏側の処理（データの保存、ログイン認証、計算処理など）を開発するエンジニアです。Java、Python、PHPなどの言語やデータベースを扱います。\n\nWebサービスはフロントエンドとバックエンドが協力して動いています。" },
            { chapter: "第2章 ビジネスシーンで使われるIT用語、ITエンジニアの種類と職種", question: "企業が抱える経営上・業務上の課題を、ITを活用して解決へと導く専門職を何と呼びますか？", options: ["プログラマー", "システムエンジニア", "ITコンサルタント", "プロジェクトマネージャー"], answer: 2, keywords: ["ITコンサルタント", "システムエンジニア"], explanation: "【ITコンサルタント】\n企業の経営課題や業務上の問題を分析し、ITを活用した解決策を提案・導入支援する専門職です。技術知識だけでなく、経営やビジネスへの深い理解も求められます。\n\n【システムエンジニア（SE）】\nシステムの設計・開発を担当する技術者です。お客様の要望をヒアリングし、システムの仕様を決めるのが主な役割です。\n\nITコンサルタントはより上流の「何をすべきか」、SEは「どう作るか」を担当するイメージです。" },
            { chapter: "第2章 ビジネスシーンで使われるIT用語、ITエンジニアの種類と職種", question: "「RPA」の正式名称とその説明として、講義では正しいものはどれですか？", options: ["Real-time Process Automation：リアルタイムで業務プロセスを自動化する技術。", "Robotic Process Automation：ソフトウェアロボットが主に定型的なPC操作を自動化する技術。", "Remote Program Access：遠隔地にあるプログラムにアクセスするための技術。", "Rapid Project Arrangement：プロジェクトを迅速に計画・調整するための手法。"], answer: 1, keywords: ["RPA", "Robotic Process Automation"], explanation: "【RPA（Robotic Process Automation）】\nソフトウェアのロボットが、人間が行っていた定型的なPC作業を自動化する技術です。物理的なロボットではなく、PC上で動くプログラムが作業を代行します。\n\n例えば：\n・Excelデータを別のシステムに転記する作業\n・毎日決まった時間にレポートを作成する作業\n・メールの添付ファイルを保存・整理する作業\n\nこれらの繰り返し作業をRPAに任せることで、人間はより創造的な仕事に集中できます。" },
            { chapter: "第3章 ベンダーの主要なサービスを説明できる", question: "クラウドコンピューティングが持つ基本的な特徴として、講義では**適切でない**ものはどれですか？", options: ["オンデマンド・セルフサービス（利用者が必要な時に必要なだけ利用できる）", "物理的なサーバーの戸別所有（利用者がサーバー機器を直接所有・管理する）", "幅広いネットワークアクセス（様々な端末からネットワーク経由で利用できる）", "リソースの共有（複数の利用者でコンピューティングリソースを共有する）"], answer: 1, keywords: ["クラウドコンピューティング", "オンデマンド"], explanation: "【クラウドコンピューティング】\nインターネット経由でサーバーやソフトウェアなどのITリソースを必要な時に必要な分だけ利用できる仕組みです。\n\n主な特徴：\n・オンデマンド：使いたい時にすぐ使え、不要になれば止められる\n・ネットワークアクセス：PC、スマホ、タブレットなど様々な端末から利用可能\n・リソースの共有：多くの利用者でサーバー等の資源を共有し、コストを抑えられる\n・スケーラビリティ：利用量に応じて柔軟にリソースを増減できる\n\n「物理サーバーを自分で所有・管理する」のはクラウドの逆（オンプレミス）の特徴です。" },
            { chapter: "第3章 ベンダーの主要なサービスを説明できる", question: "Javaなどのプログラミング言語において、特定の機能（例：ログイン認証、ウェブ機能）を開発しやすくするために提供される、骨組みとなるソフトウェアのことを一般的に何と呼びますか？", options: ["ライブラリ", "API", "フレームワーク", "モジュール"], answer: 2, keywords: ["フレームワーク", "ライブラリ", "API"], explanation: "【フレームワーク】\nアプリケーション開発のための「骨組み」や「土台」となるソフトウェアです。開発の基本的な流れや構造があらかじめ用意されており、開発者はその枠組みに沿って必要な部分を作り込みます。\n例：Spring（Java）、Ruby on Rails（Ruby）、Django（Python）\n\n【ライブラリ】\n特定の機能をまとめた部品集です。フレームワークと違い、開発者が必要な時に呼び出して使います。\n\n【API（Application Programming Interface）】\nソフトウェア同士が情報をやり取りするための窓口・ルールです。例えば天気予報APIを使えば、自分のアプリに天気情報を取り込めます。" },
            { chapter: "第3章 ベンダーの主要なサービスを説明できる", question: "Salesforce社が提供している、クラウド型の営業支援システム（SFA）および顧客関係管理システム（CRM）の代表的な製品名は、講義では何と紹介されていますか？", options: ["Dynamics 365 Sales", "Sales Cloud", "SAP S/4HANA Sales", "Oracle Siebel CRM"], answer: 1, keywords: ["Sales Cloud", "Salesforce", "CRM", "SFA"], explanation: "【Sales Cloud】\nSalesforce社が提供するクラウド型の営業支援・顧客管理システムです。\n\n【SFA（Sales Force Automation：営業支援システム）】\n営業活動を効率化するシステムです。顧客情報、商談の進捗、営業日報などを一元管理し、営業チーム全体の生産性を向上させます。\n\n【CRM（Customer Relationship Management：顧客関係管理）】\n顧客との関係を管理・強化するための仕組みです。顧客の購買履歴、問い合わせ履歴、嗜好などを分析し、より良いサービスを提供することを目指します。\n\nSales CloudはSFAとCRMの両方の機能を備えた代表的な製品です。" },
            { chapter: "第3章 ベンダーの主要なサービスを説明できる", question: "世界最大のコンピュータネットワーク機器開発会社であり、ルーターやスイッチなどの製品で高いシェアを持つ企業として、講義では紹介されているのはどれですか？", options: ["HP (Hewlett-Packard)", "Dell Technologies", "Cisco Systems", "IBM"], answer: 2, keywords: ["Cisco Systems", "ルーター", "スイッチ"], explanation: "【Cisco Systems（シスコシステムズ）】\n世界最大のネットワーク機器メーカーです。企業や通信事業者のネットワークを支えるルーターやスイッチで圧倒的なシェアを持っています。\n\n【ルーター】\n異なるネットワーク同士をつなぎ、データの通り道（経路）を決める機器です。家庭用Wi-Fiルーターも同じ原理です。\n\n【スイッチ】\n同じネットワーク内の機器同士を接続し、データを適切な相手に届ける機器です。\n\nCisco社の認定資格「CCNA」はネットワークエンジニアの登竜門として広く知られています。" },
            { chapter: "第3章 ベンダーの主要なサービスを説明できる", question: "クラウドサービスの提供形態の一つで、利用者がインターネット経由でアプリケーションソフトウェアを利用できるサービスを何と呼びますか？", options: ["IaaS (Infrastructure as a Service)", "PaaS (Platform as a Service)", "SaaS (Software as a Service)", "DaaS (Data as a Service)"], answer: 2, keywords: ["SaaS", "クラウドサービス"], explanation: "【SaaS（Software as a Service：サース）】\nインターネット経由でソフトウェアを利用できるサービスです。自分のPCにソフトをインストールする必要がなく、ブラウザなどからアクセスして使います。\n\n身近な例：\n・Gmail、Google スプレッドシート（Google Workspace）\n・Microsoft 365（Word、Excelのオンライン版）\n・Zoom（ビデオ会議）\n・Slack（チャットツール）\n\nメリット：インストール不要、どこからでも使える、常に最新版、初期費用が安い\nデメリット：インターネット接続が必須、カスタマイズに限界がある" },
            { chapter: "第4章 ITビジネスで覚えておくべき関連法規", question: "企業経営の最高責任者であるCEO (Chief Executive Officer) に対し、情報システム戦略を統括し、その実行に関する全責任を負う役職の略称は何ですか？", options: ["COO (Chief Operating Officer)", "CFO (Chief Financial Officer)", "CTO (Chief Technology Officer)", "CIO (Chief Information Officer)"], answer: 3, keywords: ["CIO", "CEO", "情報システム戦略"], explanation: "【CIO（Chief Information Officer：最高情報責任者）】\n企業の情報システム戦略を統括する役職です。ITをどう活用して経営に貢献するかを判断し、その実行に責任を持ちます。\n\n関連する役職：\n・CEO（最高経営責任者）：会社全体の経営を統括するトップ\n・COO（最高執行責任者）：日常の業務執行を統括\n・CFO（最高財務責任者）：財務・経理を統括\n・CTO（最高技術責任者）：技術面の戦略を統括\n\nCIOはITの「活用戦略」、CTOは「技術そのもの」に重点を置く点が異なります。" },
            { chapter: "第4章 ITビジネスで覚えておくべき関連法規", question: "発明、考案、意匠、商標、著作物など、人間の知的活動によって生み出された成果物に対する権利の総称を何と呼びますか？", options: ["独占禁止法", "知的財産権", "製造物責任法", "個人情報保護法"], answer: 1, keywords: ["知的財産権", "特許権", "著作権"], explanation: "【知的財産権】\n人間の知的な創造活動から生まれた成果物を保護する権利の総称です。大きく2つに分かれます。\n\n【産業財産権】（特許庁に登録が必要）\n・特許権：新しい発明を保護（出願から20年）\n・実用新案権：物品の形状や構造の考案を保護\n・意匠権：製品のデザインを保護\n・商標権：ブランドのロゴやマークを保護\n\n【著作権】（登録不要、作った時点で自動発生）\n・小説、音楽、絵画、写真、プログラムなどを保護\n\nIT業界ではソフトウェアの著作権や、技術の特許権が特に重要です。" },
            { chapter: "第4章 ITビジネスで覚えておくべき関連法規", question: "製造物の欠陥によって人の生命、身体又は財産に損害が生じた場合に、製造業者等が負うべき損害賠償責任について定めた法律を一般的に何と呼びますか？", options: ["著作権法", "PL法（製造物責任法）", "不正競争防止法", "下請法"], answer: 1, keywords: ["PL法", "製造物責任法"], explanation: "【PL法（製造物責任法：Product Liability法）】\n製品の欠陥によって消費者がケガをしたり、財産に損害を受けた場合に、製造業者が賠償責任を負うことを定めた法律です。\n\nポイント：\n・消費者は「製造者の過失（ミス）」ではなく「製品に欠陥があったこと」を証明すればよい\n・対象は「製造・加工された動産」（ソフトウェア単体は対象外だが、組み込みソフトは対象になり得る）\n\nIT業界では、ハードウェア製品やIoT機器の不具合による事故などで適用される可能性があります。" },
            { chapter: "第4章 ITビジネスで覚えておくべき関連法規", question: "他人のIDやパスワードを不正に使用したり、セキュリティホールを悪用したりして、アクセス権限のないコンピュータシステムに侵入する行為などを禁止する法律は何ですか？", options: ["サイバーセキュリティ基本法", "電子署名法", "不正アクセス禁止法", "マイナンバー法"], answer: 2, keywords: ["不正アクセス禁止法", "セキュリティホール"], explanation: "【不正アクセス禁止法】\n他人のID・パスワードを無断で使用したり、システムの脆弱性（セキュリティホール）を突いてコンピュータに不正に侵入する行為を禁止する法律です。\n\n禁止されている行為の例：\n・他人のID・パスワードを使って不正ログインする\n・セキュリティの弱点を突いてシステムに侵入する\n・他人のID・パスワードを第三者に教える\n・フィッシングサイトでID・パスワードを騙し取る\n\n【セキュリティホール】\nソフトウェアやシステムに存在する、セキュリティ上の弱点・欠陥のことです。「脆弱性（ぜいじゃくせい）」とも呼ばれます。" },
            { chapter: "第4章 ITビジネスで覚えておくべき関連法規", question: "企業などの従業員が職務上作成した著作物について、一定の要件を満たす場合に、その著作権が法人等に帰属するとされる考え方または制度を何と呼びますか？", options: ["職務発明", "業務委託", "職務著作", "権利譲渡"], answer: 2, keywords: ["職務著作", "著作権"], explanation: "【職務著作（法人著作）】\n会社の従業員が仕事として作成した著作物について、一定の条件を満たせば著作権が会社（法人）に帰属する制度です。\n\n条件：\n・法人の発意（指示）に基づいて作成されたもの\n・従業員が職務上作成したもの\n・法人名義で公表されるもの\n・契約や就業規則に別段の定めがないこと\n\n例えば、会社の指示で従業員が作成したプログラム、マニュアル、報告書などは、通常は会社が著作権を持ちます。\n\n【職務発明】は特許に関する制度で、著作権の「職務著作」とは別の概念です。" }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let reviewFlags = new Array(quizData.length).fill(false);
        let submitted = false;

        const quizContentEl = document.getElementById('quiz-content');
        const resultsContentEl = document.getElementById('results-content');
        const confirmModalEl = document.getElementById('confirm-modal');
        const sidebarEl = document.getElementById('sidebar');

        function formatQuestionText(text) { return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'); }

        function updateSidebar() {
            const grid = document.getElementById('q-grid');
            const answeredCount = userAnswers.filter(a => a !== null).length;
            const flaggedCount = reviewFlags.filter(f => f).length;
            let html = '';
            for (let i = 0; i < quizData.length; i++) {
                let cls = 'q-btn';
                if (i === currentQuestionIndex) cls += ' current';
                if (reviewFlags[i]) cls += ' skipped';
                else if (userAnswers[i] !== null) cls += ' answered';
                html += `<button class="${cls}" onclick="goToQuestion(${i})">${i + 1}</button>`;
            }
            grid.innerHTML = html;
            document.getElementById('sidebar-progress').innerHTML =
                `回答済: ${answeredCount}/${quizData.length}` + (flaggedCount > 0 ? `<br>要確認: ${flaggedCount}` : '');
        }

        function renderQuestion() {
            const questionData = quizData[currentQuestionIndex];
            const formattedQuestion = formatQuestionText(questionData.question);
            const currentAnswer = userAnswers[currentQuestionIndex];
            let optionsHtml = '<div class="options-list">';
            questionData.options.forEach((option, index) => {
                let buttonClass = "option-button";
                if (currentAnswer === index) buttonClass += " selected";
                optionsHtml += `<button class="${buttonClass}" onclick="selectAnswer(${index})">${index + 1}. ${option}</button>`;
            });
            optionsHtml += '</div>';

            const isFirst = currentQuestionIndex === 0;
            const isLast = currentQuestionIndex === quizData.length - 1;
            const isFlagged = reviewFlags[currentQuestionIndex];

            quizContentEl.innerHTML = `
                <div class="question-header">
                    <p class="text-sm text-gray-500 mb-1">${questionData.chapter}</p>
                    <h2 class="question-title">問題 ${currentQuestionIndex + 1} / ${quizData.length}</h2>
                    <p class="question-text">${formattedQuestion}</p>
                </div>
                ${optionsHtml}
                <div class="navigation-buttons">
                    <button class="nav-button secondary" onclick="prevQuestion()" ${isFirst ? 'disabled' : ''}>前の問題へ</button>
                    <button class="nav-button skip" onclick="toggleReviewFlag()" style="${isFlagged ? 'outline:2px solid #92400e;' : ''}">${isFlagged ? '確認済みにする' : '後で確認する'}</button>
                    <button class="nav-button primary" onclick="nextQuestion()">${isLast ? '回答を確認する' : '次の問題へ'}</button>
                </div>
                <div class="text-center mt-4"><button class="nav-button submit text-lg px-8 py-3" onclick="showConfirmation()">回答を確認して提出する</button></div>`;
            updateSidebar();
        }

        window.selectAnswer = function(selectedIndex) {
            userAnswers[currentQuestionIndex] = selectedIndex;
            renderQuestion();
        }

        window.nextQuestion = function() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showConfirmation();
            }
        }

        window.prevQuestion = function() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        window.toggleReviewFlag = function() {
            reviewFlags[currentQuestionIndex] = !reviewFlags[currentQuestionIndex];
            if (reviewFlags[currentQuestionIndex] && currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
            }
            renderQuestion();
        }

        window.goToQuestion = function(index) {
            currentQuestionIndex = index;
            renderQuestion();
        }

        window.showConfirmation = function() {
            const unanswered = [];
            const flagged = [];
            userAnswers.forEach((a, i) => {
                if (a === null) unanswered.push(i + 1);
            });
            reviewFlags.forEach((f, i) => {
                if (f) flagged.push(i + 1);
            });

            let warningHtml = '';
            if (unanswered.length > 0) {
                warningHtml += `<p class="unanswered-warning">${unanswered.length}件の未回答の問題があります（問題 ${unanswered.join(', ')}）</p>`;
            }
            if (flagged.length > 0) {
                warningHtml += `<p class="unanswered-warning" style="color:#92400e">${flagged.length}件の「後で確認する」が残っていますが、問題ないですか？（問題 ${flagged.join(', ')}）</p>`;
            }

            let summaryHtml = '<div class="text-left mt-4 max-h-60 overflow-y-auto"><table class="w-full text-sm"><thead><tr class="border-b"><th class="py-1 text-left">問題</th><th class="py-1 text-left">状態</th><th class="py-1 text-left">確認</th></tr></thead><tbody>';
            userAnswers.forEach((a, i) => {
                let status, color;
                if (a === null) { status = '未回答'; color = 'text-red-600'; }
                else { status = '回答済'; color = 'text-blue-600'; }
                const flagLabel = reviewFlags[i] ? '<span class="text-yellow-600 font-bold">要確認</span>' : '-';
                summaryHtml += `<tr class="border-b cursor-pointer hover:bg-gray-50" onclick="closeConfirmation();goToQuestion(${i})"><td class="py-1">問${i + 1}</td><td class="py-1 ${color} font-medium">${status}</td><td class="py-1">${flagLabel}</td></tr>`;
            });
            summaryHtml += '</tbody></table></div>';

            confirmModalEl.innerHTML = `
                <div class="confirm-box">
                    <h3 class="text-xl font-bold mb-3">回答の確認</h3>
                    ${warningHtml}
                    ${summaryHtml}
                    <div class="flex gap-3 mt-4 justify-end flex-wrap">
                        <button class="nav-button secondary" onclick="closeConfirmation()">問題に戻る</button>
                        ${(unanswered.length > 0 || flagged.length > 0) ?
                            `<button class="nav-button skip" onclick="goToFirstIncomplete()">未回答・要確認の問題へ</button>` : ''}
                        <button class="nav-button submit" onclick="submitQuiz()">提出する</button>
                    </div>
                </div>`;
            confirmModalEl.classList.remove('hidden');
        }

        window.closeConfirmation = function() {
            confirmModalEl.classList.add('hidden');
        }

        window.goToFirstIncomplete = function() {
            confirmModalEl.classList.add('hidden');
            const nextUnanswered = userAnswers.findIndex(a => a === null);
            const nextFlagged = reviewFlags.findIndex(f => f);
            let next = -1;
            if (nextUnanswered !== -1 && nextFlagged !== -1) next = Math.min(nextUnanswered, nextFlagged);
            else if (nextUnanswered !== -1) next = nextUnanswered;
            else if (nextFlagged !== -1) next = nextFlagged;
            if (next !== -1) {
                currentQuestionIndex = next;
                renderQuestion();
            }
        }

        window.submitQuiz = function() {
            confirmModalEl.classList.add('hidden');
            submitted = true;
            let score = 0;
            userAnswers.forEach((a, i) => { if (a === quizData[i].answer) score++; });
            showResults(score);
        }

        function showResults(score) {
            quizContentEl.classList.add('hidden');
            sidebarEl.classList.add('hidden');
            resultsContentEl.classList.remove('hidden');
            const percentage = ((score / quizData.length) * 100).toFixed(1);
            resultsContentEl.innerHTML = `
                <h2 class="results-title">テスト結果</h2>
                <p class="results-score">正解数: ${score} / ${quizData.length} (${percentage}%)</p>
                <div class="mb-4">
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">記録するユーザー名:</label>
                    <input type="text" id="username" name="username" class="username-input" placeholder="名前を入力してください">
                </div>
                <button class="nav-button submit mr-2" onclick="submitResultsToGoogleSheet()">結果をスプレッドシートに記録</button>
                <button class="nav-button secondary" onclick="restartQuiz()">もう一度挑戦する</button>
                <div id="submission-status"></div>
                <div id="review-button-area" class="hidden mt-4">
                    <button class="gemini-button text-lg px-6 py-3" onclick="showReview()">解説を見る</button>
                </div>`;
        }

        window.restartQuiz = function() {
            currentQuestionIndex = 0;
            userAnswers.fill(null);
            reviewFlags.fill(false);
            submitted = false;
            resultsContentEl.classList.add('hidden');
            quizContentEl.classList.remove('hidden');
            sidebarEl.classList.remove('hidden');
            renderQuestion();
        }

        window.submitResultsToGoogleSheet = function() {
            const usernameInput = document.getElementById('username');
            const username = usernameInput ? usernameInput.value.trim() : '';
            const submissionStatusEl = document.getElementById('submission-status');
            if (!username) { submissionStatusEl.textContent = 'ユーザー名を入力してください。'; submissionStatusEl.className = 'text-red-600'; return; }
            if (GOOGLE_SCRIPT_URL === '' || GOOGLE_SCRIPT_URL === 'ここにGoogle Apps ScriptのURLを貼り付け') {
                submissionStatusEl.textContent = 'Google Apps ScriptのURLが設定されていません。管理者に連絡してください。';
                submissionStatusEl.className = 'text-red-600'; return;
            }
            submissionStatusEl.textContent = '結果を送信中...'; submissionStatusEl.className = 'text-blue-600';

            let score = 0;
            userAnswers.forEach((a, i) => { if (a === quizData[i].answer) score++; });

            const dataToSubmit = {
                timestamp: new Date().toLocaleString('ja-JP'),
                username: username,
                score: score,
                totalQuestions: quizData.length,
                percentage: ((score / quizData.length) * 100).toFixed(1) + '%',
            };
            quizData.forEach((q, index) => {
                dataToSubmit[`is_correct_${index + 1}`] = userAnswers[index] === q.answer ? '正解' : (userAnswers[index] === null ? '-' : '不正解');
            });
            const params = new URLSearchParams(dataToSubmit);   
                            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: params, mode: 'no-cors' })
                                .then(() => {
            submissionStatusEl.textContent = '結果を送信しました！スプレッドシートをご確認ください。';
            submissionStatusEl.className = 'text-green-600';
            document.getElementById('review-button-area').classList.remove('hidden');
                                })
                                .catch(() => {
                                                            submissionStatusEl.textContent = '送信に失敗しました。再度お試しください。';
                                                            submissionStatusEl.className = 'text-red-600';
                                });
        }

        window.showReview = function() {
            resultsContentEl.innerHTML = '';
            resultsContentEl.classList.remove('hidden');
            let score = 0;
            userAnswers.forEach((a, i) => { if (a === quizData[i].answer) score++; });
            const percentage = ((score / quizData.length) * 100).toFixed(1);

            let reviewHtml = `<h2 class="results-title mb-2">全問解説</h2><p class="results-score mb-6">正解数: ${score} / ${quizData.length} (${percentage}%)</p>`;
            quizData.forEach((q, index) => {
                const userAns = userAnswers[index];
                const isCorrect = userAns === q.answer;
                const isSkipped = userAns === null;
                const userAnswer = isSkipped ? '未回答' : q.options[userAns];
                const correctAnswer = q.options[q.answer];
                const borderColor = isCorrect ? 'border-green-300 bg-green-50' : 'border-red-300 bg-red-50';
                const icon = isCorrect ? '<span class="text-green-600 font-bold text-lg">○</span>' : '<span class="text-red-600 font-bold text-lg">×</span>';

                reviewHtml += `
                    <div class="mb-4 p-4 border-2 rounded-lg ${borderColor} text-left">
                        <div class="flex items-start justify-between">
                            <div>
                                <p class="text-xs text-gray-500">${q.chapter}</p>
                                <h3 class="font-semibold mt-1">問題 ${index + 1}：${formatQuestionText(q.question)}</h3>
                            </div>
                            ${icon}
                        </div>
                        <div class="mt-2 text-sm">
                            <p>あなたの回答：<span class="${isCorrect ? 'text-green-700' : 'text-red-700'} font-bold">${userAnswer}</span></p>
                            ${!isCorrect ? `<p>正解：<span class="text-green-700 font-bold">${correctAnswer}</span></p>` : ''}
                        </div>
                        <details class="mt-3">
                            <summary class="cursor-pointer text-blue-600 hover:text-blue-800 font-medium text-sm">解説を見る</summary>
                            <div class="mt-2 p-3 bg-white rounded border border-gray-200 whitespace-pre-wrap text-sm">${q.explanation}</div>
                        </details>
                    </div>`;
            });
            reviewHtml += `<div class="text-center mt-6"><button class="nav-button secondary" onclick="restartQuiz()">もう一度挑戦する</button></div>`;
            resultsContentEl.innerHTML = reviewHtml;
        }

        renderQuestion();
    </script>
</body>
</html>
